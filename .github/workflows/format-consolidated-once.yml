name: Format consolidated AI files once

on:
  push:
    branches:
      - upgrade/pdf-2026-10

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[format-once]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write lib/ai/chatOrchestrator.ts lib/ai/tools.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ai/chatOrchestrator.ts lib/ai/tools.ts
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style: format consolidated AI files [format-once]"
          git push
