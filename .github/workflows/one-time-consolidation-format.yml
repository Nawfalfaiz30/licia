name: one-time consolidation formatting

on:
  push:
    branches:
      - upgrade/pdf-2026-10

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format consolidated files
        run: >
          npx prettier --write
          app/step-up/page.tsx
          components/auth/StepUpAuth.tsx
          lib/ai/chatOrchestrator.ts
          lib/ai/toolDefinitions.ts
          lib/ai/toolRouting.ts
          lib/ai/tools.ts
          lib/security/step-up.ts
          lib/sync/client.ts
      - name: Commit formatting
        run: |
          if git diff --quiet --exit-code; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             app/step-up/page.tsx             components/auth/StepUpAuth.tsx             lib/ai/chatOrchestrator.ts             lib/ai/toolDefinitions.ts             lib/ai/toolRouting.ts             lib/ai/tools.ts             lib/security/step-up.ts             lib/sync/client.ts
          git commit -m "style: format consolidated changes"
          git push origin HEAD:upgrade/pdf-2026-10
