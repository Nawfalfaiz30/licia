name: Temporary PR3 formatter

on:
  push:
    branches:
      - upgrade/pdf-2026-10

permissions:
  contents: write

jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: auto-format PR3 files') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prettier --write lib/ai/chatOrchestrator.ts lib/ai/conversationIntelligence.ts lib/ai/crudRouting.test.ts lib/ai/toolDefinitions.ts lib/ai/toolRouting.ts lib/ai/tools.ts

      - name: Commit formatted files
        run: |
          if git diff --quiet -- lib/ai/chatOrchestrator.ts lib/ai/conversationIntelligence.ts lib/ai/crudRouting.test.ts lib/ai/toolDefinitions.ts lib/ai/toolRouting.ts lib/ai/tools.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ai/chatOrchestrator.ts lib/ai/conversationIntelligence.ts lib/ai/crudRouting.test.ts lib/ai/toolDefinitions.ts lib/ai/toolRouting.ts lib/ai/tools.ts
          git commit -m "chore: auto-format PR3 files"
          git push origin HEAD:${GITHUB_REF_NAME}
