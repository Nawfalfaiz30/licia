name: Refresh dependency lockfile

on:
  push:
    branches: ["upgrade/pdf-2026-10"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11
      - run: rm -f package-lock.json && npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
