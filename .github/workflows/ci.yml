name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: true
      LICIA_BUILD_ONLY: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://ci.example.com
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      NEXT_PUBLIC_SITE_URL: https://ci.example.com
      APP_URL: https://ci.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # One-time lockfile regeneration step for PCF. The next PCF commit will
      # restore npm ci using the generated lockfile artifact.
      - run: npm install --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: pcf-generated-package-lock
          path: package-lock.json
      - name: Commit generated lockfile
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already in sync"
            exit 0
          fi
          git commit -m "upgrade PCF"
          git push
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run i18n:check
      - run: npm run audit
      - run: node scripts/test-v57.mjs && node scripts/test-v54-2.mjs && node scripts/test-v54.mjs && node scripts/test-v53.mjs
      - run: npm run build
