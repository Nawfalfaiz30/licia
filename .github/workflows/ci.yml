name: CI

on:
  push:
    branches: ["main", "upgrade/**"]
  pull_request:

concurrency:
  group: licia-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run security
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm audit --audit-level=high

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: coverage
          if-no-files-found: ignore

  eval:
    name: AI eval corpus gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run eval:gate
      - run: npm run eval:judge
      - run: npm run db:verify

  build:
    name: Production build
    needs: [static, unit]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      NEXT_PUBLIC_SITE_URL: https://ci-placeholder.example
      APP_URL: https://ci-placeholder.example
      LICIA_BUILD_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  e2e:
    name: Playwright critical flows
    if: vars.LICIA_E2E_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          OPENAI_API_KEY: ci-placeholder-openai-key
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          APP_URL: http://127.0.0.1:3000
          LICIA_BUILD_ONLY: "1"
      - run: npm start > /tmp/licia.log 2>&1 &
      - run: npx --yes playwright@latest install --with-deps chromium
      - run: npx --yes playwright@latest test
