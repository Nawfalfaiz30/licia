name: Format i18n dictionary

on:
  push:
    branches: ["upgrade/pdf-2026-10"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write lib/locales/en.ts
      - run: |
          if git diff --quiet -- lib/locales/en.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/locales/en.ts
          git commit -m "chore: format English locale dictionary"
          git push origin HEAD:${GITHUB_REF_NAME}
