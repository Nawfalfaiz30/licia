name: one-time i18n formatting

on:
  push:
    branches:
      - upgrade/pdf-2026-10

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format i18n file
        run: npx prettier --write lib/locales/en.ts
      - name: Commit formatting
        run: |
          if git diff --quiet --exit-code; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/locales/en.ts
          git commit -m "style: format i18n translations"
          git push origin HEAD:upgrade/pdf-2026-10
