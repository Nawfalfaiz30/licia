name: Fix remaining formatting

on:
  push:
    branches: ["upgrade/pdf-2026-10"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write app/api/ai/batch/route.ts app/api/backup/route.ts app/api/intelligence/route.ts app/api/v36/feedback/route.ts app/api/v38/daily-plan/route.ts lib/ai/chatOrchestrator.ts lib/ai/tools.ts lib/ai/usage.ts lib/v35/brain.ts
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format remaining files"
          git push origin HEAD:${GITHUB_REF_NAME}
