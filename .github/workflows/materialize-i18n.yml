name: Materialize i18n missing

on:
  push:
    branches: ["upgrade/pdf-2026-10"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node scripts/i18n.mjs missing > .i18n-missing.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .i18n-missing.json
          git commit -m "ci: materialize i18n missing list"
          git push origin HEAD:${GITHUB_REF_NAME}
