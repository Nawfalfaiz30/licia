<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3d5fd9">
  <title>Licia · Offline</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111523;color:#eef1fa;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}main{width:min(100%,480px);text-align:center;border:1px solid #30384f;border-radius:24px;padding:32px;background:#171c2d;box-shadow:0 20px 50px rgba(0,0,0,.2)}h1{margin:0 0 8px}p{color:#a9b0c5;line-height:1.6}button{margin-top:18px;border:0;border-radius:12px;background:#3d5fd9;color:#fff;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}button:active{transform:scale(.98)}
  </style>
</head>
<body>
  <main>
    <h1>Licia sedang offline</h1>
    <p>Koneksi internet terputus. Capture yang sudah diantrikan tetap disimpan di perangkat dan akan dicoba sinkronkan saat koneksi kembali.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
